<title>Barra Sepia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Juego de atención y memoria: atiende comandas con una máquina de café de los años 50.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&amp;family=Rye&amp;family=Special+Elite&amp;display=swap">
<style>
/* Barra Sepia — un solo mundo visual: cafetería de 1952, cartel esmaltado y papel de comanda.
   Tema único a propósito (no hay variante oscura): fondo y colores definidos de forma explícita. */
:root {
  --wall: #2a1d15;
  --wall-stripe: #31231a;
  --ink: #2b1d14;
  --paper: #f3e6c9;
  --paper-shade: #e2cfa6;
  --cream: #f7eedb;
  --brass: #c8a25a;
  --brass-dark: #8c6c2f;
  --brick: #b04a32;
  --brick-dark: #7d3121;
  --brick-soft: #ecc0b0;
  --teal: #4f8a83;
  --teal-dark: #2f5c56;
  --mustard: #d9a634;
  --muted: #6b5640;
  --scrim: rgba(26, 18, 13, 0.74);
  --font-display: "Rye", "Georgia", serif;
  --font-body: "Libre Baskerville", "Georgia", serif;
  --font-type: "Special Elite", "Courier New", monospace;
  --gutter: 6px;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  background: var(--wall);
  background-image: repeating-linear-gradient(90deg, var(--wall) 0 22px, var(--wall-stripe) 22px 36px);
  color: var(--paper);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

#app {
  box-sizing: border-box;
  height: 100%;
  display: flex;
  padding-block: 6px;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}

/* En el visor de Claude: margen lateral de 16 px. */
#app[data-target="viewer"] {
  --gutter: 16px;
}

#stage {
  position: relative;
  flex: 1;
  min-width: 0;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 0 3px var(--brass-dark), 0 10px 30px rgba(0, 0, 0, 0.5);
  background: var(--wall);
}

#game {
  position: absolute;
  inset: 0;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#game canvas {
  display: block;
  outline: none;
}

/* --- Pantallas superpuestas ------------------------------------------------ */

.overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  overflow-y: auto;
  padding: clamp(10px, 3vw, 28px);
  background: var(--scrim);
  -webkit-overflow-scrolling: touch;
}

.overlay[hidden] {
  display: none !important;
}

.card {
  box-sizing: border-box;
  width: 100%;
  max-width: 620px;
  margin: auto 0;
  padding: clamp(18px, 4vw, 34px);
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.35), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(140, 108, 47, 0.12), transparent 45%);
  border: 4px solid var(--brass-dark);
  border-radius: 18px;
  box-shadow: inset 0 0 0 2px var(--brass), 0 18px 40px rgba(0, 0, 0, 0.45);
  line-height: 1.55;
  animation: card-in 220ms ease-out;
}

.card.wide {
  max-width: 920px;
}

@keyframes card-in {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.card h1,
.card h2 {
  font-family: var(--font-display);
  font-weight: 400;
  color: var(--brick);
  line-height: 1.1;
  text-wrap: balance;
  margin: 0.1em 0 0.35em;
}

.card h1 {
  font-size: clamp(2.4rem, 8vw, 3.8rem);
  text-shadow: 3px 3px 0 var(--paper-shade);
}

.card h2 {
  font-size: clamp(1.7rem, 5vw, 2.3rem);
}

.card h3 {
  font-family: var(--font-type);
  font-weight: 400;
  font-size: 1rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin: 0 0 0.3em;
  color: var(--teal-dark);
}

.eyebrow {
  margin: 0;
  font-family: var(--font-type);
  font-size: 0.82rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--teal-dark);
}

.lede {
  margin: 0 0 1em;
  max-width: 62ch;
}

.loading {
  font-family: var(--font-type);
  font-size: 1.2rem;
  margin: 0.4em 0 0;
}

.steps {
  list-style: none;
  counter-reset: step;
  margin: 0 0 1em;
  padding: 0;
  display: grid;
  gap: 0.55em;
}

.steps li {
  counter-increment: step;
  display: grid;
  grid-template-columns: 2.1em 1fr;
  gap: 0.6em;
  align-items: start;
}

.steps li::before {
  content: counter(step);
  display: grid;
  place-items: center;
  width: 1.9em;
  height: 1.9em;
  border-radius: 50%;
  background: var(--brass);
  border: 2px solid var(--brass-dark);
  font-family: var(--font-display);
  color: var(--ink);
}

.rule {
  display: inline-block;
  margin: 0 0 1.1em;
  padding: 0.35em 0.8em;
  border: 2px dashed var(--brick);
  border-radius: 8px;
  color: var(--brick-dark);
  font-family: var(--font-type);
  transform: rotate(-0.6deg);
}

.first-time {
  margin: 0 0 1.1em;
  padding: 0.7em 0.9em;
  background: var(--cream);
  border: 2px solid var(--teal-dark);
  border-radius: 10px;
}

.recap {
  margin: 0 0 1em;
  padding-left: 1.2em;
  display: grid;
  gap: 0.4em;
}

.options,
.settings {
  display: grid;
  gap: 0.7em;
  margin: 0 0 1.2em;
}

.check,
.select,
.range {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5em 0.7em;
  min-height: 44px;
}

.check input {
  width: 1.4em;
  height: 1.4em;
  accent-color: var(--teal-dark);
}

.select select {
  font: inherit;
  padding: 0.35em 0.6em;
  border: 2px solid var(--brass-dark);
  border-radius: 8px;
  background: var(--cream);
  color: var(--ink);
  min-height: 44px;
}

.range input {
  flex: 1;
  min-width: 140px;
  accent-color: var(--brick);
}

.hint {
  flex-basis: 100%;
  margin-left: 2.1em;
  font-size: 0.85em;
  color: var(--muted);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.7em;
  margin: 0.6em 0 0.4em;
}

.btn {
  font-family: var(--font-display);
  font-size: 1.1rem;
  min-height: 48px;
  padding: 0.55em 1.15em;
  border: 3px solid var(--ink);
  border-radius: 12px;
  background: var(--paper-shade);
  color: var(--ink);
  box-shadow: 0 4px 0 var(--ink);
  cursor: pointer;
  transition: transform 80ms ease, box-shadow 80ms ease;
}

.btn:hover {
  background: var(--cream);
}

.btn.primary {
  background: var(--mustard);
}

.btn.primary:hover {
  background: #e7b84c;
}

.btn.danger {
  background: var(--brick-soft);
}

.btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--ink);
}

.btn:focus-visible,
.check input:focus-visible,
.select select:focus-visible,
.range input:focus-visible,
#game canvas:focus-visible {
  outline: 3px solid var(--teal-dark);
  outline-offset: 3px;
}

.note,
.disclaimer {
  font-size: 0.86rem;
  color: var(--muted);
  max-width: 70ch;
}

.disclaimer {
  font-style: italic;
  margin: 1em 0 0;
  padding-top: 0.8em;
  border-top: 1px dashed var(--brass-dark);
}

.empty {
  font-size: 1.05rem;
  max-width: 60ch;
}

/* --- Cuaderno y resumen ------------------------------------------------------ */

.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 0.9em;
  margin: 0.4em 0 1em;
}

.metric {
  min-width: 0;
  padding: 0.9em 1em;
  background: var(--cream);
  border: 2px solid var(--brass-dark);
  border-radius: 12px;
}

.metric-value {
  margin: 0;
  font-family: var(--font-display);
  font-size: 2.1rem;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}

.metric-trend {
  margin: 0.35em 0;
}

.chip {
  display: inline-block;
  padding: 0.15em 0.6em;
  border-radius: 999px;
  font-family: var(--font-type);
  font-size: 0.8rem;
  background: var(--paper-shade);
  color: var(--ink);
}

.metric-mejora .chip {
  background: var(--teal-dark);
  color: var(--paper);
}

.metric-baja .chip {
  background: var(--brick-dark);
  color: var(--paper);
}

.metric-help {
  margin: 0.3em 0 0;
  font-size: 0.82rem;
  color: var(--muted);
}

.spark {
  display: block;
  width: 100%;
  max-width: 168px;
  height: auto;
  margin-top: 0.3em;
}

.spark-grid {
  stroke: var(--paper-shade);
  stroke-width: 1;
  stroke-dasharray: 3 3;
}

.spark-area {
  fill: var(--teal);
  fill-opacity: 0.18;
  stroke: none;
}

.spark-line {
  fill: none;
  stroke: var(--teal-dark);
  stroke-width: 2.5;
  stroke-linejoin: round;
}

.spark-dot {
  fill: var(--brick);
  stroke: var(--cream);
  stroke-width: 1.5;
}

.details {
  list-style: none;
  padding: 0;
  margin: 0 0 0.8em;
  display: flex;
  flex-wrap: wrap;
  gap: 0.4em 1.2em;
  font-family: var(--font-type);
  font-variant-numeric: tabular-nums;
}

.day {
  font-weight: 700;
  color: var(--teal-dark);
}

.table-title {
  margin-top: 0.4em;
}

.table-wrap {
  overflow-x: auto;
  margin: 0 0 0.6em;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.92rem;
}

th,
td {
  padding: 0.45em 0.6em;
  border-bottom: 1px solid var(--paper-shade);
  text-align: left;
  white-space: nowrap;
}

th {
  font-family: var(--font-type);
  font-weight: 400;
  color: var(--teal-dark);
}

.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.noscript {
  margin: 2em;
  color: var(--paper);
}

/* Texto grande */
html.large-text .card {
  font-size: 118%;
}

/* Movimiento reducido */
html.reduced-motion .card {
  animation: none;
}

html.reduced-motion .btn {
  transition: none;
}

@media (prefers-reduced-motion: reduce) {
  .card {
    animation: none;
  }

  .btn {
    transition: none;
  }
}

@media (max-width: 420px) {
  .btn {
    flex: 1 1 100%;
  }
}
</style>

  <main id="stage">

    </div>
  </main>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <noscript><p class="noscript">Barra Sepia necesita JavaScript para funcionar.</p></noscript>
</div>

    if (gauge) {
      // Zona objetivo.
      const a0 = angleAt(gauge.zoneMin);
      const a1 = angleAt(gauge.zoneMax);
      const zoneColor = this.options.colorBlind ? 0x3b6fb6 : inZone ? 0x3fa596 : COLORS.teal;
      g.fillStyle(zoneColor, 0.9);
      g.slice(x, y, r - 4, a0, a1, false);
      g.fillPath();
      g.fillStyle(COLORS.cream, 1);
      g.fillCircle(x, y, r - 22);
      if (this.options.colorBlind) {
        g.lineStyle(3, COLORS.ink, 1);
        for (const a of [a0, a1]) {
          g.lineBetween(x + Math.cos(a) * (r - 24), y + Math.sin(a) * (r - 24), x + Math.cos(a) * (r + 2), y + Math.sin(a) * (r + 2));
        }
      }
    }
    // Marcas.
    g.lineStyle(2, COLORS.ink, 1);
    for (let i = 0; i <= 10; i++) {
      const a = angleAt(i / 10);
      const inner = i % 5 === 0 ? r - 14 : r - 8;
      g.lineBetween(x + Math.cos(a) * inner, y + Math.sin(a) * inner, x + Math.cos(a) * (r - 2), y + Math.sin(a) * (r - 2));
    }
    // Zona roja final.
    g.lineStyle(5, COLORS.brick, 1);
    g.beginPath();
    g.arc(x, y, r - 4, angleAt(0.9), angleAt(1), false);
    g.strokePath();

    // Aguja.
    const value = gauge ? gauge.value : 0;
    const a = angleAt(value);
    g.lineStyle(zone ? 5 : 4, zone ? (inZone ? COLORS.tealDark : COLORS.brick) : COLORS.brickDark, 1);
    g.lineBetween(x, y, x + Math.cos(a) * (r - 8), y + Math.sin(a) * (r - 8));
    g.fillStyle(COLORS.ink, 1);
    g.fillCircle(x, y, 7);
    g.fillStyle(COLORS.brass, 1);
    g.fillCircle(x, y, 3);

    // Indicación en el centro del manómetro: qué hacer ahora.
    let label = "PRESIÓN";
    let color = CSS.ink;
    if (zone === "in") {
      label = "EN ZONA";
      color = CSS.tealDark;
    } else if (zone === "below") {
      label = "PULSA";
      color = CSS.brickDark;
    } else if (zone === "above") {
      label = "SUELTA";
      color = CSS.brickDark;
    }
    if (zone === "below" || zone === "above") {
      // Flecha: hacia dónde debe ir la aguja.
      const ay = y + r * 0.72;
      const dir = zone === "below" ? -1 : 1;
      g.fillStyle(COLORS.brickDark, 1);
      g.fillTriangle(x - 7, ay - dir * 4, x + 7, ay - dir * 4, x, ay + dir * 5);
    } else if (zone === "in") {
      g.fillStyle(COLORS.tealDark, 1);
      g.fillCircle(x, y + r * 0.72, 5);
    }
    const key = `${label}|${color}`;
    if (key !== this.gaugeLabelKey) {
      this.gaugeLabelKey = key;
      this.gaugeLabel.setText(label);
      this.gaugeLabel.setColor(color);
      this.gaugeLabel.setFontSize(zone ? 16 : 13);
    }
  }

  /**
   * Dibuja el estado de la máquina. Se llama cada cuadro.
   * @param {import("../core/machine.js").MachineState|null} state
   * @param {number} dtMs
   */
  update(state, dtMs) {
    this.time += dtMs;
    const rm = this.options.reducedMotion;
    const phase = state?.phase ?? "idle";
    const step = state && state.stepIndex >= 0 ? state.steps[state.stepIndex] : null;
    const brewing = phase === "brewing";

    // Rebote: más vivo mientras trabaja.
    const bounceSpeed = brewing ? 140 : 380;
    const bounceAmp = rm ? 0 : brewing ? 4 : 3;
    const bounce = Math.sin(this.time / bounceSpeed) * bounceAmp;
    this.hop = Math.max(0, this.hop - dtMs * 0.06);
    const bodyY = bounce - this.hop;
    this.body.setPosition(this.shakeX, bodyY);
    this.drawLegs(bodyY);

    // Molino.
    const grinding = brewing && step?.visual === "grind";
    if (grinding && !rm) this.crankAngle += dtMs * 0.02;
    this.crank.setRotation(this.crankAngle);
    if (grinding || this._wasGrinding) this.drawHoppers(grinding, step?.variant === "decaf");
    this._wasGrinding = grinding;

    // Manómetro.
    const gaugeActive = brewing && !!step?.gauge;
    this.drawGauge(gaugeActive ? state.gauge : null, gaugeActive);

    // Placa y lámparas.
    this.updatePlaque(state);
    this.updateLamps(state);

    // Taza.
    this.updateCup(state, dtMs);

    // Chorro y efectos del paso actual.
    this.updateStream(state, step);
    this.updateParticles(dtMs);

    // Cara.
    this.updateFace(state, step, gaugeActive);
  }

  drawLegs(bodyY) {
    const g = this.legs;
    g.clear();
    const hipY = 536 + bodyY;
    const squash = Math.max(-6, Math.min(10, bodyY));
    for (const side of [-1, 1]) {
      const hipX = CX + side * 70;
      const footX = CX + side * 96;
      const footY = 568;
      const kneeX = hipX + side * (14 + squash * 1.2);
      const kneeY = (hipY + footY) / 2;
      const curve = new Phaser.Curves.QuadraticBezier(
        new Phaser.Math.Vector2(hipX, hipY),
        new Phaser.Math.Vector2(kneeX, kneeY),
        new Phaser.Math.Vector2(footX, footY),
      );
      const pts = curve.getPoints(14);
      g.lineStyle(20, COLORS.ink, 1);
      g.strokePoints(pts, false);
      g.lineStyle(13, COLORS.tealDark, 1);
      g.strokePoints(pts, false);
      // Zapato.
      g.fillStyle(COLORS.black, 0.35);
      g.fillEllipse(footX + side * 12, footY + 14, 84, 14);
      g.fillStyle(COLORS.ink, 1);
      g.fillEllipse(footX + side * 12, footY + 4, 76, 30);
      g.fillStyle(COLORS.brickDark, 1);
      g.fillEllipse(footX + side * 12, footY + 1, 68, 24);
      g.fillStyle(COLORS.white, 0.35);
      g.fillEllipse(footX + side * 20, footY - 5, 22, 7);
    }
  }

  updatePlaque(state) {
    const drinkId = state?.selectedDrink ?? null;
    const mods = state?.modifiers ?? [];
    const phase = state?.phase ?? "idle";
    const step = phase === "brewing" && state.stepIndex >= 0 ? state.steps[state.stepIndex] : null;
    const key = `${drinkId}|${mods.join(",")}|${phase}|${step?.label}|${this.options.largeText}|${this.options.colorBlind}`;
    if (key === this.lastPlaqueKey) return;
    this.lastPlaqueKey = key;
    // La placa muestra la bebida elegida; mientras prepara, el paso en curso.
    let label = drinkId ? this.catalog.drinks[drinkId].label.toUpperCase() : "ELIGE UNA BEBIDA";
    let color = drinkId ? CSS.ink : "#8a755c";
    if (phase === "brewing") {
      label = step ? `${step.label.toUpperCase()}…` : "…";
      color = CSS.brickDark;
    } else if (phase === "ready") {
      label = "¡LISTO!";
      color = CSS.tealDark;
    }
    this.plaqueText.setText(label);
    this.plaqueText.setColor(color);
    fitText(this.plaqueText, 206, 30, drinkId ? 24 : 17, 11);

    // Lámparas de modificadores bajo la placa.
    const g = this.plaque;
    g.clear();
    g.fillStyle(COLORS.brassDark, 1);
    g.fillRoundedRect(CX - 112, 248, 224, 42, 10);
    g.fillStyle(COLORS.cream, 1);
    g.fillRoundedRect(CX - 108, 252, 216, 34, 8);
    const ids = this.catalog.modifierOrder;
    const spacing = 52;
    const startX = CX - ((ids.length - 1) * spacing) / 2;
    ids.forEach((id, i) => {
      const on = mods.includes(id);
      const x = startX + i * spacing;
      const y = 306;
      g.fillStyle(COLORS.tealDark, 1);
      g.fillCircle(x, y, 13);
      g.fillStyle(on ? COLORS.glow : COLORS.chromeDark, 1);
      g.fillCircle(x, y, 10);
      if (on) drawModifierIcon(g, this.catalog.modifiers[id].icon, x, y, 15);
      else if (this.options.colorBlind) {
        g.lineStyle(2, COLORS.ink, 0.6);
        g.lineBetween(x - 5, y, x + 5, y);
      }
    });
  }

  updateLamps(state) {
    const steps = state?.steps ?? [];
    const idx = state?.stepIndex ?? -1;
    const phase = state?.phase ?? "idle";
    const blink = Math.floor(this.time / 260) % 2;
    const key = `${steps.map((s) => s.id).join(",")}|${idx}|${phase}|${phase === "brewing" ? blink : 0}`;
    if (key === this.lastLampsKey) return;
    this.lastLampsKey = key;
    const g = this.lamps;
    g.clear();
    const n = Math.max(steps.length, 1);
    const spacing = Math.min(40, 280 / n);
    const startX = CX - ((n - 1) * spacing) / 2;
    g.fillStyle(COLORS.tealDark, 1);
    g.fillRoundedRect(CX - 150, LAMPS_Y - 16, 300, 32, 16);
    for (let i = 0; i < n; i++) {
      const x = startX + i * spacing;
      let color = COLORS.chromeDark;
      if (steps.length) {
        if (phase === "ready" || i < idx) color = COLORS.mustard;
        else if (i === idx) color = blink || this.options.reducedMotion ? COLORS.glow : COLORS.mustardLight;
        else color = 0x6d7f7a;
      }
      g.fillStyle(COLORS.ink, 1);
      g.fillCircle(x, LAMPS_Y, 11);
      g.fillStyle(color, 1);
      g.fillCircle(x, LAMPS_Y, 8);
      if (i === idx && phase === "brewing") {
        g.fillStyle(COLORS.white, 0.7);
        g.fillCircle(x - 2, LAMPS_Y - 3, 3);
      }
    }
  }

  /** Construye el contenido de la taza a partir de los pasos completados y el actual. */
  cupSpecFor(state) {
    const steps = state.steps;
    const phase = state.phase;
    const idx = phase === "ready" ? steps.length : state.stepIndex;
    const progress = phase === "ready" ? 1 : state.stepProgress;
    const icon = this.catalog.drinks[state.selectedDrink].icon;
    const togo = state.modifiers.includes("llevar");
    /** @type {import("./draw.js").CupSpec} */
    const spec = { vessel: togo ? "togo" : icon.vessel, layers: [], toppings: [], mark: icon.mark, lid: false };
    for (let i = 0; i < steps.length && i <= idx; i++) {
      const s = steps[i];
      const f = i < idx ? 1 : progress;
      if (f <= 0) continue;
      if (s.fill) spec.layers.push({ color: hexToNum(s.fill.color), amount: s.fill.amount * f });
      if (s.visual === "art") {
        // El corazón del latte se dibuja poco a poco.
        spec.toppings.push("heart");
        spec.heartScale = Math.min(1, f * 1.2);
      } else if (f >= 0.6) {
        if (s.visual === "dust") {
          spec.toppings.push("dust");
          if (s.color) spec.dustColor = hexToNum(s.color);
        } else if (s.visual === "ice") spec.toppings.push("ice");
        else if (s.visual === "sugar") spec.toppings.push("sugar");
        else if (s.visual === "lid") spec.lid = true;
      }
    }
    const current = phase === "brewing" ? steps[idx] : null;
    if (current && current.fill && !this.options.reducedMotion) {
      // Mientras cae líquido, la superficie ondula.
      spec.wave = { amp: 2.4, phase: this.time / 70 };
    }
    return spec;
  }

  updateCup(state, dtMs) {
    const phase = state?.phase ?? "idle";
    const rm = this.options.reducedMotion;
    if (phase !== this.cupPhase) {
      if (phase === "brewing" && this.cupPhase !== "brewing") this.cupDropMs = 0;
      this.cupPhase = phase;
    }
    if (phase === "idle" || !state?.selectedDrink) {
      this.cup.clear();
      this.cupFx.clear();
      this.cupSpec = null;
      this.cupGeo = null;
      return;
    }

    // La taza cae sobre la bandeja, se aplasta un poco al aterrizar y se recupera.
    this.cupDropMs += dtMs;
    const t = rm ? 1 : Math.min(1, this.cupDropMs / 420);
    this.cupLanded = t >= 1;
    let offset = 0;
    let squash = 1;
    if (t < 0.6) {
      const f = t / 0.6;
      offset = -110 * (1 - f * f);
    } else if (t < 1) {
      const f = (t - 0.6) / 0.4;
      squash = 1 - 0.14 * Math.sin(Math.PI * f);
    }
    if (phase === "ready" && !rm) offset = -Math.abs(Math.sin(this.time / 240)) * 5;
    this.cupOffsetY = offset;
    this.cupBox.setPosition(CUP.x, CUP.base + offset);
    this.cupBox.setScale(1 / Math.sqrt(squash), squash);

    const spec = this.cupSpecFor(state);
    this.cupSpec = spec;
    const g = this.cup;
    g.clear();
    if (phase === "ready") {
      const pulse = rm ? 0.5 : 0.35 + 0.25 * Math.sin(this.time / 160);
      g.fillStyle(COLORS.glow, pulse);
      g.fillEllipse(0, -CUP.size * 0.42, CUP.size * 1.6, CUP.size * 1.3);
    }
    this.cupGeo = drawCup(g, spec, 0, 0, CUP.size);
    this.drawCupEffects(state, spec, this.cupGeo);
  }

  /** Burbujas de espuma, vapor que sube de la taza y destellos al terminar. */
  drawCupEffects(state, spec, geo) {
    const g = this.cupFx;
    g.clear();
    const rm = this.options.reducedMotion;
    const top = spec.layers[spec.layers.length - 1];
    const foamColors = [hexToNum(this.catalog.fills.foam ?? "#f7efdc"), hexToNum(this.catalog.fills.oatfoam ?? "#efe0bd")];
    if (top && foamColors.includes(top.color) && !spec.lid) {
      g.fillStyle(COLORS.white, 0.9);
      g.lineStyle(1.5, COLORS.paperEdge, 0.8);
      for (let i = 0; i < 6; i++) {
        const x = (i / 5 - 0.5) * geo.surfaceW * 0.7;
        const r = 2 + (rm ? 1 : 1.2 * (1 + Math.sin(this.time / 180 + i * 1.7)));
        g.fillCircle(x, geo.surfaceY + 3 + (i % 2) * 3, r);
        g.strokeCircle(x, geo.surfaceY + 3 + (i % 2) * 3, r);
      }
    }
    // Vapor: dos volutas que suben de la taza mientras hay líquido caliente.
    if (spec.layers.length && !spec.lid) {
      for (let k = 0; k < 2; k++) {
        const cycle = rm ? 0.4 : ((this.time / 1500 + k * 0.5) % 1);
        const alpha = rm ? 0.35 : Math.sin(Math.PI * cycle) * 0.55;
        const baseY = geo.topY - 8 - cycle * 40;
        const pts = [];
        for (let j = 0; j <= 8; j++) {
          pts.push({ x: (k ? 14 : -14) + Math.sin(j * 0.8 + this.time / 260 + k * 2) * 6, y: baseY - j * 6 });
        }
        g.lineStyle(3, COLORS.steam, alpha);
        g.strokePoints(pts, false);
      }
    }
    // Destellos cuando la bebida está lista.
    if (state.phase === "ready") {
      for (let i = 0; i < 4; i++) {
        const a = (rm ? 0 : this.time / 900) + (i * Math.PI) / 2 + 0.4;
        const rad = CUP.size * 0.62;
        const x = Math.cos(a) * rad;
        const y = -CUP.size * 0.45 + Math.sin(a) * rad * 0.75;
        const size = rm ? 6 : 4 + 3 * (1 + Math.sin(this.time / 150 + i * 1.3));
        drawSparkle(g, x, y, size);
      }
    }
  }

  updateStream(state, step) {
    const g = this.stream;
    g.clear();
    if (!state || state.phase !== "brewing" || !step || !this.cupGeo || !this.cupLanded) return;
    const surfaceY = CUP.base + this.cupOffsetY + this.cupGeo.surfaceY;
    const rm = this.options.reducedMotion;
    const fillColor = step.fill ? hexToNum(step.fill.color) : null;
    if (step.visual === "pour" || step.visual === "water" || step.visual === "syrup") {
      // Chorro que se afina al caer, con un brillo y salpicaduras en la superficie.
      const top = step.visual === "pour" ? 11 : 7;
      const bottom = top * 0.45;
      const len = Math.max(0, surfaceY - SPOUT.y);
      const pts = [];
      const n = 8;
      for (let i = 0; i <= n; i++) {
        const f = i / n;
        const w = top + (bottom - top) * f;
        const x = SPOUT.x + (rm ? 0 : Math.sin(this.time / 45 + f * 5) * 1.6 * f);
        pts.push({ x: x - w / 2, y: SPOUT.y + len * f });
      }
      for (let i = n; i >= 0; i--) {
        const f = i / n;
        const w = top + (bottom - top) * f;
        const x = SPOUT.x + (rm ? 0 : Math.sin(this.time / 45 + f * 5) * 1.6 * f);
        pts.push({ x: x + w / 2, y: SPOUT.y + len * f });
      }
      g.fillStyle(fillColor ?? COLORS.ink, 1);
      g.fillPoints(pts, true);
      g.fillStyle(COLORS.white, 0.3);
      g.fillRect(SPOUT.x - 1, SPOUT.y, 1.5, len * 0.8);
      // Onda donde cae el chorro.
      const ring = rm ? 0.5 : (this.time / 300) % 1;
      g.lineStyle(2, COLORS.white, 0.5 * (1 - ring));
      g.strokeEllipse(SPOUT.x, surfaceY + 2, 10 + ring * 26, 3 + ring * 6);
      this.emit("splash", SPOUT.x, surfaceY, 0.45, fillColor ?? COLORS.ink);
    } else if (step.visual === "steam") {
      this.emit("steam", WAND.x, WAND.y, 0.35);
      // La leche o la espuma entra con un remolino suave en la superficie.
      if (!rm) {
        const a = this.time / 120;
        g.lineStyle(2, COLORS.white, 0.6);
        g.beginPath();
        g.arc(SPOUT.x, surfaceY + 3, 12, a, a + Math.PI * 1.2, false);
        g.strokePath();
      }
    } else if (step.visual === "dust" || step.visual === "ice" || step.visual === "sugar" || step.visual === "cream" || step.visual === "lid" || step.visual === "art") {
      const color = step.visual === "dust" && step.color ? hexToNum(step.color) : step.visual === "ice" ? 0xdff1f2 : COLORS.white;
      this.emit("drop", CUP.x + (Math.random() - 0.5) * 30, SPOUT.y + 6, step.visual === "dust" ? 0.5 : 0.12, color);
    } else if (step.visual !== "grind") {
      this.emit("steam", CUP.x, SPOUT.y + 10, 0.15);
    }
  }

  /** Partículas simples (vapor, gotas, humo, salpicaduras). */
  emit(kind, x, y, rate, color = COLORS.steam) {
    if (this.options.reducedMotion && kind !== "smoke") return;
    if (Math.random() > rate) return;
    const splash = kind === "splash";
    this.particles.push({
      kind,
      x,
      y,
      vx: kind === "steam" ? (Math.random() - 0.3) * 0.03 : kind === "smoke" ? (Math.random() - 0.5) * 0.06 : splash ? (Math.random() - 0.5) * 0.12 : 0,
      vy: kind === "drop" ? 0.18 : splash ? -0.08 - Math.random() * 0.06 : -0.05 - Math.random() * 0.04,
      gravity: splash ? 0.0006 : 0,
      r: kind === "drop" ? 3 : splash ? 2 + Math.random() * 1.5 : 6 + Math.random() * 6,
      life: 0,
      max: kind === "drop" ? 380 : splash ? 320 : 900,
      color,
    });
  }

  updateParticles(dtMs) {
    const g = this.fx;
    g.clear();
    const keep = [];
    for (const p of this.particles) {
      p.life += dtMs;
      if (p.life >= p.max) continue;
      if (p.life < 0) {
        keep.push(p);
        continue;
      }
      if (p.gravity) p.vy += p.gravity * dtMs;
      p.x += p.vx * dtMs;
      p.y += p.vy * dtMs;
      const t = p.life / p.max;
      if (p.kind === "drop" || p.kind === "splash") {
        g.fillStyle(p.color, 1);
        g.fillCircle(p.x, p.y, p.r);
      } else {
        g.fillStyle(p.kind === "smoke" ? 0x8c8579 : p.color, (1 - t) * (p.kind === "smoke" ? 0.8 : 0.6));
        g.fillCircle(p.x, p.y, p.r * (1 + t * 1.4));
      }
      keep.push(p);
    }
    this.particles = keep;
  }

  updateFace(state, step, gaugeActive) {
    const g = this.face;
    g.clear();
    const phase = state?.phase ?? "idle";
    if (this.time > this.moodUntil) this.mood = "smile";

    // Hacia dónde mira.
    let target = { x: Math.sin(this.time / 1700) * 0.6, y: Math.cos(this.time / 2300) * 0.3 };
    if (gaugeActive) target = { x: 0, y: -1 };
    else if (phase === "brewing") target = { x: 0, y: 1 };
    else if (phase === "ready") target = { x: Math.sin(this.time / 500) * 0.9, y: -0.9 };
    const k = this.options.reducedMotion ? 1 : 0.15;
    this.look.x += (target.x - this.look.x) * k;
    this.look.y += (target.y - this.look.y) * k;

    // Parpadeo.
    if (this.time > this.blinkAt) {
      this.blinkUntil = this.time + 120;
      this.blinkAt = this.time + 2500 + ((this.time * 7) % 3000);
    }
    const blinking = this.time < this.blinkUntil && !this.options.reducedMotion;
    const worried = gaugeActive && state?.gauge && !state.gauge.inZone && state.gauge.elapsedMs > 700;

    for (const eye of EYES) {
      g.fillStyle(COLORS.ink, 1);
      g.fillEllipse(eye.x, eye.y, 58, blinking ? 10 : 72);
      g.fillStyle(COLORS.white, 1);
      g.fillEllipse(eye.x, eye.y, 50, blinking ? 4 : 64);
      if (!blinking) {
        const px = eye.x + this.look.x * 10;
        const py = eye.y + this.look.y * 16;
        // Pupila "de pastel" con la porción recortada, típica de los dibujos de los 30.
        g.fillStyle(COLORS.ink, 1);
        g.fillEllipse(px, py, 20, 32);
        g.fillStyle(COLORS.white, 1);
        g.slice(px, py, 12, -Math.PI * 0.62, -Math.PI * 0.38, false);
        g.fillPath();
      }
      // Cejas.
      g.lineStyle(6, COLORS.ink, 1);
      const browY = eye.y - 42 - (phase === "ready" ? 6 : 0);
      const tilt = worried || this.mood === "cough" ? (eye.x < CX ? 6 : -6) : 0;
      g.lineBetween(eye.x - 18, browY + tilt, eye.x + 18, browY - tilt);
    }

    // Boca.
    const mouthY = 238;
    g.lineStyle(6, COLORS.ink, 1);
    if (this.mood === "cough") {
      g.fillStyle(COLORS.ink, 1);
      g.fillEllipse(CX, mouthY, 22, 18);
    } else if (this.mood === "grin") {
      g.fillStyle(COLORS.ink, 1);
      g.slice(CX, mouthY - 8, 26, 0.15, Math.PI - 0.15, false);
      g.fillPath();
      g.fillStyle(COLORS.brick, 1);
      g.fillEllipse(CX, mouthY + 10, 18, 8);
    } else if (worried) {
      g.beginPath();
      g.moveTo(CX - 22, mouthY);

      // Se arranca un nivel por debajo del último: calentamiento.
      startLevel: clampLevel(settingsStore.progress.lastLevel - 1),
      sessionId: `s-${startedAt.getTime().toString(36)}-${seed.toString(36)}`,
    });
    if (game && game.canvas) game.canvas.focus({ preventScroll: true });
  }

  /** Práctica guiada: dos comandas con guion, sin reloj y sin guardar en el historial. */
  function startPractice() {
    if (!scene) return;
    audio.unlock();
    audio.applySettings(settingsStore.settings);
    const seed = newSeed();
    startedAt = new Date();
    overlay.hide();
    audio.setTrack(trackFor(settingsStore.settings.musicTrack, "practica"));
    scene.startSession({
      seed,
      mode: "practica",
      durationMs: 30 * 60 * 1000,
      startLevel: 1,
      sessionId: `p-${startedAt.getTime().toString(36)}`,
      scriptedOrders: PRACTICE_ORDERS,
      gaugeStepScale: PRACTICE_GAUGE_SCALE,
    });
    if (game && game.canvas) game.canvas.focus({ preventScroll: true });
  }

  async function onSessionEnd(session) {
    const log = session.log;
    const state = session.getState();
    if (state.mode === "practica") {
      if (state.endReason === "done") {
        settingsStore.updateProgress({ practiced: true });
        overlay.setPracticed(true);
        overlay.show("practice-done");
        announce("Práctica completada.");
      } else {
        overlay.show("start");
      }
      return;
    }
    const end = log[log.length - 1];
    const summary = end.summary;
    const resolved = summary.served + summary.missed;
    if (resolved > 0 && store) {
      await store.saveSession({
        id: state.sessionId,
        startedAt: (startedAt || new Date()).toISOString(),
        seed: state.seed,
        levelId: state.levelId,
        mode: state.mode,
        durationMs: state.durationMs,
        endLevel: summary.endLevel,
        summary,
        events: telemetryEvents(log),
      });
      settingsStore.updateProgress({ lastLevel: summary.endLevel });
    }
    const records = store ? await store.listSessions(50) : [];
    const history = records.map((r) => r.summary);
    if (resolved === 0) history.push(summary);
    const today = dayKey(new Date());
    const sessionsToday = records.filter((r) => dayKey(new Date(r.startedAt)) === today).length;
    overlay.showSummary(summary, history, { sessionsToday: Math.max(1, sessionsToday), recommended: RECOMMENDED_SESSIONS });
    announce(`Turno terminado. Serviste ${summary.served} comandas.`);
  }

  try {
    const [Phaser, raw, opened] = await Promise.all([ensurePhaser(), loadRecipes(build), openStore()]);
    store = opened;
    const catalog = loadCatalog(raw);
    await waitForFonts(1500);
    const BarScene = defineBarScene(Phaser);
    const size = logicalSize(gameEl.clientWidth, gameEl.clientHeight);
    game = new Phaser.Game({
      type: Phaser.AUTO,
      parent: gameEl,
      backgroundColor: "#2a1d15",
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: size.width,
        height: size.height,
      },
      input: { activePointers: 3 },
      audio: { noAudio: true },
      banner: false,
      disableContextMenu: true,
      render: { antialias: true },
    });
    game.scene.add("bar", BarScene, true, {
      app: {
        catalog,
        getSettings: () => settingsStore.settings,
        audio,
        announce,
        onSessionEnd: (session) => {
          onSessionEnd(session).catch((err) => overlay.showError(String(err && err.message ? err.message : err)));
        },
        onPauseRequest: () => overlay.show("pause"),
        onToggleMusic: () => {
          const on = !settingsStore.settings.musicOn;
          applySettings({ musicOn: on });
          announce(on ? "Música encendida." : "Música apagada.");
        },
        onReady: (readyScene) => {
          scene = readyScene;
          game.canvas.setAttribute("tabindex", "0");
          game.canvas.setAttribute("aria-label", "Barra Sepia: máquina de café, riel de comandas y consola");
          overlay.show("start");
          api.ready = true;
        },
      },
    });

    // Tamaño lógico adaptable: vertical u horizontal según la pantalla.
    let lastKey = `${size.width}x${size.height}`;
    const onResize = () => {
      const next = logicalSize(gameEl.clientWidth, gameEl.clientHeight);
      const key = `${next.width}x${next.height}`;
      if (key !== lastKey) {
        lastKey = key;
        game.scale.setGameSize(next.width, next.height);
      }
      game.scale.refresh();
    };
    if (globalThis.ResizeObserver) new ResizeObserver(onResize).observe(gameEl);
    else window.addEventListener("resize", onResize);

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && scene && scene.running && !scene.paused) {
        scene.pauseSession();
        overlay.show("pause");
      }
    });

    registerServiceWorker(build);
  } catch (err) {
    overlay.showError(err && err.message ? err.message : String(err));
    console.error(err);
  }
}

boot();
return { APP_VERSION };
})();
})();
</script>
